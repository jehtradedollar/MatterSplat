<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatterSplat Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%232f6fde'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
    --accent: #2f6fde; --accent-soft: #e8f0fd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #scene { position: absolute; inset: 0; }
  #panel { position: absolute; top: 12px; left: 12px; bottom: 12px; width: 232px; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 2px 10px rgba(16,24,40,.08); }
  #panel header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  #panel h1 { margin: 0; font-size: 14px; font-weight: 600; }
  #file { color: var(--muted); font-size: 12px; word-break: break-all; }
  .row { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px;
    padding: 5px 9px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  #sweeps { flex: 1; overflow-y: auto; padding: 6px 8px; }
  #sweeps button { display: block; width: 100%; text-align: left; border: none; padding: 5px 8px; margin: 1px 0; }
  #sweeps button.on { background: var(--accent-soft); color: var(--accent); }
  #help { padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  #stats { position: absolute; top: 12px; right: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-variant-numeric: tabular-nums; color: var(--muted); }
  #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; }
  @media (max-width: 640px) { #panel { width: auto; right: 12px; bottom: auto; max-height: 45%; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
  "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="panel">
  <header><h1>MatterSplat</h1><div id="file"></div></header>
  <div class="row">
    <button id="mode-walk" class="on" title="Look around from where you stand">Walk</button>
    <button id="mode-orbit" title="Orbit around a point in front of you">Orbit</button>
    <button id="reset" title="Back to the first sweep">Reset view</button>
  </div>
  <div id="sweeps"></div>
  <div id="help">Drag to look (Orbit: drag to orbit), scroll to zoom.<br>W A S D / arrows move, Q E down/up, Shift faster.<br>Click a sweep to jump there.</div>
</div>
<div id="stats">loading</div>
<div id="loading">Loading splat...</div>

<script type="module">
import * as THREE from "three";
import * as GaussianSplats3D from "@mkkellogg/gaussian-splats-3d";

// Query: ?file=<splat url>&sweeps=<sweeps.json url>&sh=<0-2, for .ply only>
const q = new URLSearchParams(location.search);
const file = q.get("file") || "data/splat.splat";
const sweepsUrl = q.get("sweeps") || "data/sweeps.json";
const shDegree = parseInt(q.get("sh") || "0", 10);
const UP = new THREE.Vector3(0, 0, 1);  // E57 world is Z-up
document.getElementById("file").textContent = file;

let sweeps = [];
try { sweeps = (await (await fetch(sweepsUrl)).json()).sweeps; } catch (e) { console.warn("no sweeps.json", e); }

const start = sweeps.length ? sweeps[0] : { position: [0, 0, 1.5], directions: [[1, 0, 0]] };
const viewer = new GaussianSplats3D.Viewer({
  rootElement: document.getElementById("scene"),
  cameraUp: [0, 0, 1],
  initialCameraPosition: start.position,
  initialCameraLookAt: lookAt(start, 0, 0.05),
  sharedMemoryForWorkers: crossOriginIsolated,
  sphericalHarmonicsDegree: shDegree,
  antialiased: false,
});
const t0 = performance.now();
await viewer.addSplatScene(file, { showLoadingUI: false, progressiveLoad: false, splatAlphaRemovalThreshold: 5 });
const loadSeconds = (performance.now() - t0) / 1000;
document.getElementById("loading").remove();
viewer.start();

const camera = viewer.camera, controls = viewer.controls;
camera.near = 0.02; camera.updateProjectionMatrix();
let mode = "walk";  // walk: orbit target sits just ahead of the eye, so dragging looks around
const TARGET = { walk: 0.05, orbit: 2.5 };

function lookAt(s, k, dist) {
  const d = s.directions[k % s.directions.length];
  return [s.position[0] + d[0] * dist, s.position[1] + d[1] * dist, s.position[2] + d[2] * dist];
}
function setTargetAhead(dist) {
  const fwd = new THREE.Vector3().subVectors(controls.target, camera.position).normalize();
  controls.target.copy(camera.position).addScaledVector(fwd, dist);
  controls.update();
}
function jump(i, k = 0) {
  const s = sweeps[i];
  camera.up.copy(UP);
  camera.position.set(...s.position);
  controls.target.set(...lookAt(s, k, TARGET[mode]));
  controls.update();
  document.querySelectorAll("#sweeps button").forEach((b, j) => b.classList.toggle("on", j === i));
}
function setMode(m) {
  mode = m;
  document.getElementById("mode-walk").classList.toggle("on", m === "walk");
  document.getElementById("mode-orbit").classList.toggle("on", m === "orbit");
  setTargetAhead(TARGET[m]);
}
document.getElementById("mode-walk").onclick = () => setMode("walk");
document.getElementById("mode-orbit").onclick = () => setMode("orbit");
document.getElementById("reset").onclick = () => sweeps.length && jump(0);

const list = document.getElementById("sweeps");
sweeps.forEach((s, i) => {
  const b = document.createElement("button");
  b.textContent = `Sweep ${s.index}`;
  b.onclick = () => jump(i);
  list.appendChild(b);
});
if (sweeps.length) jump(0);

// keyboard movement in the horizontal plane (Q/E vertical); target moves with the eye
const keys = new Set();
addEventListener("keydown", e => keys.add(e.key.toLowerCase()));
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
let last = performance.now(), frames = 0, fpsT = last, fps = 0;
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  const speed = (keys.has("shift") ? 4 : 1.5) * dt;
  const fwd = new THREE.Vector3().subVectors(controls.target, camera.position); fwd.z = 0; fwd.normalize();
  const right = new THREE.Vector3().crossVectors(fwd, UP).normalize();
  const move = new THREE.Vector3();
  if (keys.has("w") || keys.has("arrowup")) move.add(fwd);
  if (keys.has("s") || keys.has("arrowdown")) move.sub(fwd);
  if (keys.has("d") || keys.has("arrowright")) move.add(right);
  if (keys.has("a") || keys.has("arrowleft")) move.sub(right);
  if (keys.has("e")) move.add(UP);
  if (keys.has("q")) move.sub(UP);
  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar(speed);
    camera.position.add(move); controls.target.add(move); controls.update();
  }
  frames++;
  if (now - fpsT > 1000) {
    fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now;
    document.getElementById("stats").textContent =
      `${fps.toFixed(0)} fps · loaded in ${loadSeconds.toFixed(1)} s · ${viewer.getSplatMesh().getSplatCount().toLocaleString()} splats`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// hooks for scripted checks: window.mattersplat.jump(i, face), .stats(), .screenshot(name)
window.mattersplat = {
  viewer, jump, setMode,
  stats: () => ({ fps, loadSeconds, splats: viewer.getSplatMesh().getSplatCount(), crossOriginIsolated,
                  renderer: (() => { const gl = viewer.renderer.getContext(); const ext = gl.getExtension("WEBGL_debug_renderer_info");
                                     return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : "unknown"; })() }),
  async screenshot(name) {
    viewer.update(); viewer.render();  // read back in the same task, before the buffer is cleared
    const data = viewer.renderer.domElement.toDataURL("image/jpeg", 0.92);
    const r = await fetch(`screenshot?name=${encodeURIComponent(name)}`, { method: "POST", body: data });
    return r.ok ? await r.text() : `failed: ${r.status}`;
  },
};
</script>
</body>
</html>
